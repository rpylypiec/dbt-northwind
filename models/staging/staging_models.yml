version: 2

models:
  - name: stg_customers
    description: "Clientes com colunas padronizadas e chave primária definida."
    columns:
      - name: customer_id
        description: "Identificador único do cliente."
        tests:
          - not_null
          - unique
      - name: company_name
        description: "Nome da empresa."
      - name: contact_name
        description: "Nome do responsável pela empresa."
      - name: country
        description: "País onde a empresa está localizada."

  - name: stg_orders
    description: "Pedidos com datas tratadas e vínculo com clientes."
    columns:
      - name: order_id
        description: "Identificador único do pedido."
        tests:
          - not_null
          - unique
      - name: customer_id
        description: "Identificador do cliente associado ao pedido."
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: order_date
        description: "Data em que o pedido foi realizado."
      - name: order_year
        description: "Ano em que o pedido foi realizado."

  - name: stg_order_details
    description: "Itens de pedido com valores padronizados."
    columns:
      - name: order_id
        description: "Identificador do pedido."
        tests:
          - not_null
      - name: product_id
        description: "Identificador produto associado ao pedido."
      - name: unity_price
        description: "Preço unitário do produto."
      - name: quantify
        description: "Quantidade física do produto no pedido."
      - name: discount
        description: "Valor de desconto aplicado no pedido."
      - name: line_revenue
        description: "Cálculo de receita do pedido."

  - name: stg_products
    description: "Tabela de produtos com identificador e descritivo."
    columns:
      - name: product_id
        description: "Identificador único do produto."
      - name: product_name
        description: "Nome descritivo do produto."